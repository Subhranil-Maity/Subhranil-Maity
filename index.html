<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subhranil Maity</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Inter, Segoe UI, sans-serif;
            background: linear-gradient(
                -45deg,
                #0f172a,
                #1e293b,
                #0f172a,
                #111827
            );
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
            color: white;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: min(90%, 700px);
            padding: 3rem;
            text-align: center;

            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.3),
                0 0 40px rgba(59,130,246,.15);
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(
                135deg,
                #3b82f6,
                #8b5cf6
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin-bottom: 1rem;
        }

        .highlight {
            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: .3s;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            transform: translateY(-3px);
            background: #3b82f6;
        }

        .secondary {
            border: 1px solid rgba(255,255,255,.15);
            color: white;
        }

        .secondary:hover {
            background: rgba(255,255,255,.08);
        }

        footer {
            margin-top: 2rem;
            color: #94a3b8;
            font-size: .9rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">S</div>

        <h1>Hello, I'm <span class="highlight">Subhranil Maity</span></h1>

        <p>
            Welcome to my corner of the internet.
            I'm passionate about technology, software,
            open-source projects, and building cool things.
        </p>

        <div class="buttons">
            <a href="https://github.com/Subhranil-Maity" class="btn primary">
                GitHub
            </a>

            <a href="mailto:your@email.com" class="btn secondary">
                Contact Me
            </a>
        </div>

        <footer>
            © 2026 Subhranil Maity
        </footer>
    </div>

</body>
</html>
